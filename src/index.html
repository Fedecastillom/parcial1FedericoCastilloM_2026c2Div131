<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parcial 1</title>
  <link href="css/style.css" rel="stylesheet">
  <script defer src="js/script.js"></script>
</head>

<body>
  <header>
    <p>Parcial 1 - Div 131</p>
  </header>

  <hr>

  <main>

    <h1 id="titulo-users">Users</h1>
    <hr>
    <div class="botonera">

      <div class="botones-filtro">
        <div>
          <label>
            <input type="radio" name="filtroUsers" value="active" class="btn-filtro"> Active
          </label>

          <label>
            <input type="radio" name="filtroUsers" value="inactive" class="btn-filtro"> Inactive
          </label>

          <label>
            <input type="radio" name="filtroUsers" value="all" class="btn-filtro"> All
          </label>
        </div>

        <input id="search-box" type="search" name="" value="" placeholder="Search Users">
      </div>

      <div class="botones-admin">
        <button class="btn-admin" id="btn-create">Create</button>
        <button class="btn-admin" id="btn-deactivate">Deactivate</button>
        <button class="btn-admin" id="btn-reset-pwd">Reset Password</button>
      </div>

    </div>

    <div id="users-containter">
      <table id="tabla-usuarios">
      </table>
    </div>
  </main>


  <hr>
  <footer>
    <p>Federico Castillo Menegotto</p>
  </footer>
</body>

</html>
